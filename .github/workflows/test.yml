name: Teaching checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests and documentation checks
        run: python -m unittest discover -s tests -v
      - name: Full teaching suite
        run: python scripts/run_all.py --out results/ci
      - name: Save generated reports and reproduction manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: teaching-results-py${{ matrix.python }}
          path: results/ci/
          retention-days: 14
          if-no-files-found: error
